# Render Blueprint: background worker only. The web app (pages + /api/v1) is on Vercel (see HANDOFF.md).
# REVIEW BEFORE APPLYING. Background workers have no free tier on Render: `starter` costs money; confirm current pricing first.
# Database is external (Supabase Postgres). All secrets are sync:false.
services:
  - type: worker
    name: college-solver-worker
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production      # refuses the fixture (mock) AI provider
      - key: DATABASE_URL
        sync: false            # Supabase Transaction pooler string (port 6543), same as Vercel
      - key: DATABASE_CA_CERT
        sync: false            # Supabase CA certificate PEM text (Database settings > SSL configuration)
      - key: SESSION_SECRET
        generateValue: true    # required by config validation; the worker signs no sessions
      - key: AI_PROVIDER
        value: gemini          # must match Vercel
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RUNTIME_MODEL
        sync: false            # must match Vercel, e.g. gemini-3.8-flash
      - key: WORKER_CONCURRENCY
        value: "2"
